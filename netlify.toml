# Netlify: es una web estática, no necesita compilar nada.
[build]
  publish = "."
  command = ""

# Las fotos, el logo y las librerías casi no cambian: se guardan en caché un día.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# El panel no aparece en buscadores
[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex"
